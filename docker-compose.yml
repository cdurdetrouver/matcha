services:
  frontend:
    build: ./frontend
    container_name: frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - matcha.net
    ports:
      - "5173:5173"
    depends_on:
      - backend
  db:
    container_name: db
    image: postgis/postgis:17-3.4
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      retries: 5
      start_period: 10s
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./db:/var/lib/postgresql/data
    networks:
      - matcha.net

  db_ui:
    container_name: db_ui
    image: dpage/pgadmin4:6.21
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
      - PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION=${PGADMIN_ENHANCED_COOKIE_PROTECTION}
      - PGADMIN_CONFIG_LOGIN_BANNER="${PGADMIN_LOGIN_BANNER}"
      - PGADMIN_CONFIG_CONSOLE_LOG_LEVEL=${PGADMIN_CONSOLE_LOG_LEVEL}
      - PGADMIN_LISTEN_PORT=${PGADMIN_LISTEN_PORT}
    volumes:
      - ./db_ui/servers.json:/pgadmin4/servers.json
      - ./db_ui/pass.pgpass:/pgadmin4/.pgpass
    ports:
      - "5050:5050"
    networks:
      - matcha.net

  backend:
    build: ./backend
    container_name: backend
    volumes:
      - ./backend:/app
    networks:
      - matcha.net
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  redisgraph:
    container_name: redisgraph
    image: redislabs/redisgraph:latest
    command:
      - /bin/sh
      - -c
      - redis-server --requirepass "${REDISGRAPH_PASSWORD}" --loadmodule /usr/lib/redis/modules/redisgraph.so
    ports:
      - "6378:6379"
    networks:
      - matcha.net
    volumes:
      - ./redis_data:/data
    restart: unless-stopped

  redis-insight:
    image: redis/redisinsight:latest
    restart: always
    networks:
      - matcha.net
    ports:
      - "5540:5540"

networks:
  matcha.net:
    driver: bridge
